name: Bug report
description: Report a reproducible FreshMemory problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve FreshMemory. Do not include secrets or private memory data.
  - type: input
    id: version
    attributes:
      label: FreshMemory version
      placeholder: 0.2.2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: 22.13.0
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Codex
        - Claude Desktop
        - Another MCP client
        - Command line only
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a minimal example with sensitive values removed.
    validations:
      required: true
